services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/payroll_ops.db
      AI_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - api-data:/data

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api

volumes:
  api-data:
